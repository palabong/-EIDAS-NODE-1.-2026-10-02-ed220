# fly.toml app configuration file for Project Bilanx / eIDAS Node
#
# IMPORTANT: Inject all credentials and environment-specific identifiers via Fly Secret Manager
# (never hardcode secrets in fly.toml):
#   fly secrets set \
#     GOOGLE_CLIENT_ID="<your-oauth-client-id>" \
#     GEMINI_API_KEY="<your-gemini-api-key>" \
#     INSTITUTIONAL_KEY_JSON='<jwk-json>' \
#     GOOGLE_CLOUD_PROJECT="<your-gcp-project-id>" \
#     FIRESTORE_DATABASE_ID="<your-firestore-db-id>"

app = 'eidas-node-1-2026-10-02-ed220-black-water-1048'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  APP_ORIGIN = 'https://eidas-node-1-2026-10-02-ed220-black-water-1048.fly.dev'
  # Hosted sandbox. Known demo citizens and the software authenticator stay available.
  # A production boot without this flag still refuses both.
  ALLOW_PILOT_DEMO = 'true'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
