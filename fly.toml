# fly.toml app configuration file generated for eidas-node-1-2026-10-02-ed220-black-water-1048 on 2026-10-03T20:24:05+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'eidas-node-1-2026-10-02-ed220-black-water-1048'
primary_region = 'fra'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  GOOGLE_CLIENT_ID = 'your_client_id.apps.googleusercontent.com'
  APP_ORIGIN = 'https://eidas-node-1-2026-10-02-ed220-black-water-1048.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
